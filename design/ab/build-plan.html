  do:['Đã làm 20/10: bệ màn cho Guition 4,3", camera cáp 75 mm, tay nắm khoét âm, khung Mix 2','Sửa parameters_ab.json theo bảng đo: bo Guition, board CAM, servo, gối đỡ, puly, ray, V lỗ','Vẽ thêm lối cắm USB-C của 2 board và giá kẹp camera','Nếu bước 2 phải đổi gì (đai, góc, vị trí camera) thì sửa luôn','Chạy lại script, commit, đăng lại artifact'],
  how:[['Chạy CAD','Trong thư mục design: uv run --no-project --python 3.12 --with cadquery==2.8.0 --with ezdxf python cad/smart_bin_ab.py. Xoá ab/b_frame trước khi chạy để không còn file cũ. Mất khoảng 10 phút.'],['Script tự kiểm tra','25 tư thế xoay và nghiêng không va chạm; camera thấy 72/72 điểm mép đĩa; servo dùng ≤ 50% lực; các bo nằm gọn trong bệ; cáp camera với tới board; thùng không chạm khung; miệng thùng cách thanh chữ thập ≥ 20 mm.'],['Kiểm tra file','Mở vài file DXF xem có đủ lỗ, mở STEP lắp ráp xem có đủ chi tiết. Các file chỉ khác dấu thời gian thì trả về bản cũ để commit gọn.']],
  risk:['Quên xoá thư mục đầu ra cũ: còn file của chi tiết đã bỏ.','Sửa số mà không chạy lại kiểm tra: lỗi chỉ lộ ra lúc lắp.'],
  tools:['uv và cadquery 2.8.0','Git'],
  out:[['File','CAD theo mạch S3-1','Đã có, theo số của nhà bán (20/10)',1],['File','dimensions.json theo hàng thật','Mọi số mua sẵn đã thay bằng số đo',0],['Kiểm tra','25 tư thế, camera 72/72','0 va chạm, 72/72 điểm',0]],
  links:[['Artifact thiết kế',DESIGN]]},

 {n:4,t:'Đặt gia công và vật liệu đợt 2',tr:'mech',st:'todo',time:'1–2 tuần',cost:'khoảng 5,7–8,7 triệu (đợt 2 + khung, vỏ bọc inox, đủ bulông theo CAD)',dep:'Bước 2 đạt, bước 3',
  why:'Đây là phần tốn tiền nhất. Chỉ đặt khi cơ cấu đã thử đạt và CAD đã sửa theo hàng thật.',
  do:['Sắt V lỗ 3×3 dày 2 mm: 12 m, nhờ cửa hàng cắt sẵn 4 cây 1155 mm, 9 cây 671 mm và 1 cây 665 mm, mua kèm ke góc, bulông M8, 4 chân tăng chỉnh M8 đế Ø30','Formex: 1 tấm 15 mm (sàn, tấm đỡ đầu) và 1 tấm 8 mm (2 đáy khay), gửi file cắt','Alu composite 6 mm cắt lẻ: 2 tấm bắt ray và vách giữa','Inox 304 1 mm: nắp trên, 2 hông, lưng, tấm che trước, 2 mặt ngăn kéo, 4 nẹp gân; cắt laser và gấp mép kín 10 mm. Cùng đơn: 4 bản đế chân thép 3 mm hàn đai ốc M8','Nhôm tấm A5052: mâm, đĩa, đế xoay, cắt laser','Nhôm hộp 30×30, 40×30, thanh dẹt 30×13 cho cụm đầu','Tấm PP 2 mm (phễu) và PP 3 mm (4 thùng), cắt CNC gộp với Formex','In 3D ở trường: giá chữ C, giá servo, hub trục xoay, tai đĩa, cục chặn, 4 hộp cảm biến, bệ màn','Ray bi 600 mm 2 cặp, rivet, vòng chun, bulông nhỏ'],
  how:[['Gom theo xưởng','Xưởng 1 (tiệm biển quảng cáo): Formex 8 và 15 mm, PP 3 mm thùng, PP 2 mm phễu, alu 6 mm cắt lẻ. Xưởng 2 (laser kim loại): nhôm tấm cụm đầu, vỏ và nắp inox kèm chấn, 4 bản đế chân. Cửa hàng kệ: sắt V lỗ cắt sẵn và phụ kiện. Gom như vậy chỉ chịu mỗi nơi một lần phí tối thiểu.'],['File gửi đi','Mọi file nằm trong design/ab/b_frame: dxf/ cho tấm cắt (đơn vị mm, tỉ lệ 1:1), cut_list_slotted_angle.csv cho sắt V lỗ, parts/*.stl cho in 3D. Vỏ và nắp inox gửi side_panel_left/right, back_panel, head_panel_front, drawer_front_left/right, drawer_stiffener_x4, top_cover, mỗi file có lớp CUT, BEND, NOTE. Bản đế chân gửi parts/foot_plate_*.step.'],['Tiết kiệm công cắt','Các tấm Formex chữ nhật nhờ kho cắt thẳng bằng máy cưa tấm. Chỉ tấm đỡ đầu (lỗ Ø560) và thùng PP (rãnh gấp, lỗ) mới cần CNC.'],['Hỏi trước khi đặt','Giá đã gồm VAT và ship chưa; có cắt theo kích thước không; thời gian giao. Ghi giá thật vào sheet.']],
  risk:['Mua sắt V lỗ dày 1,5 mm vì rẻ: khung yếu, rung theo servo.','Mua bulông M6 cho V lỗ: lỗ chuẩn của thanh là cho M8.','Đặt CNC cả các tấm chữ nhật: tốn gấp 2–3 lần.'],
  tools:['File DXF, STL, cut list trong design/ab/b_frame','Sheet vật tư tab 2'],
  out:[['Gói file','Gửi từng xưởng','Mỗi xưởng nhận đúng file và số lượng',0],['Báo giá','So với sheet','Lệch ≤ 30%, giá thật đã ghi vào sheet',0]],
  links:[['Sheet vật tư (tab 2)',SHEET],['Artifact thiết kế',DESIGN]]},

 {n:5,t:'Lắp khung sắt V lỗ và ngăn kéo',tr:'mech',st:'todo',time:'1–2 ngày',cost:'đã tính ở bước 4',dep:'Bước 4',
  why:'Khung là nền cho mọi phần khác. Khung lệch thì ngăn kéo kẹt, cụm đầu không ngồi đúng chỗ.',
  do:['Lắp 4 cột và 10 thanh ngang bằng ke góc và bulông M8','Đặt tấm sàn Formex 15 mm lên 3 thanh dưới, bắt bulông','Bắt 2 tấm bắt ray alu 6 mm vào cột qua ống lót 18 mm, đặt vách giữa','Bắt ray bi, lắp khay ngăn kéo (đáy Formex 8 mm, thành PP 3 mm tán rivet)','Gắn 2 công tắc hành trình cuối khay','Đặt tấm đỡ đầu Formex 15 mm lên 4 thanh trên','Kẹp tai 4 bản đế chân giữa cột và thanh dưới, vặn 4 chân tăng chỉnh vào đai ốc hàn'],
  how:[['Thứ tự thanh','Thanh dưới chỉ có 3 (2 hông và sau), phía trước để trống cho khay chạy ra. Thanh giữa ở z = 450 có 3 thanh (2 hông và sau). Thanh trên có đủ 4, đỡ tấm đỡ đầu ở z = 1044.'],['Vuông góc','Siết tạm bulông, đo 2 đường chéo của từng mặt và của mặt đáy, chỉnh tới khi bằng nhau (lệch ≤ 2 mm), rồi mới siết chặt. Dùng long đền vênh vì servo chạy gây rung.'],['Ray','Bắt ray song song, đo khoảng cách 2 đầu ray, lệch ≤ 1 mm. Kéo khay ra hết và đẩy vào vài lần, không được kẹt.'],['Kiểm tra','Đặt 2 thùng PP rỗng vào khay, kéo ra đẩy vào, công tắc phải nhả khi kéo khay ra.']],
  risk:['Siết chặt ngay từ đầu: không chỉnh được vuông góc nữa.','Hai ray không song song: ngăn kéo kẹt hoặc trượt nặng.'],
  tools:['Cờ lê 13 (bulông M8), cờ lê 8','Thước dây, thước vuông','Máy khoan, mũi 5,5 mm','Kìm rút rivet'],
  out:[['Số đo','2 đường chéo khung','Lệch ≤ 2 mm',0],['Đạt / không','Ngăn kéo trượt','Kéo ra hết, đẩy vào êm, không kẹt',0],['Đạt / không','Công tắc ngăn kéo','Nhả khi khay mở',0]],
  links:[['Tab Thân B',DESIGN]]},

 {n:6,t:'Gấp 4 thùng PP',tr:'mech',st:'todo',time:'1 ngày',cost:'đã tính ở bước 4',dep:'Bước 4',
  why:'Gấp thử 1 thùng trước để biết độ dày tấm làm kích thước lệch bao nhiêu. Thùng phải lọt khít khay.',
  do:['Gấp thử 1 thùng: thân thành ống vuông, tán 8 rivet mép dán','Lắp đáy: gấp 4 vạt lên, đẩy vào trong ống, tán 8 rivet','Gấp 4 mảnh mép miệng ra ngoài','Đo, đặt thử vào khay, rồi làm 3 thùng còn lại','Lồng vòng chun, lót túi thử'],
  how:[['Gấp theo rãnh','Rãnh chữ V đã được CNC rạch sẵn (lớp BEND trong file). Gấp từ từ, nếu tấm cứng thì hơ nóng nhẹ bằng máy khò dọc rãnh.'],['Tán rivet','Rivet nhôm Ø4 kèm long đền ở mặt trong, vì PP mềm, đầu rivet dễ rút qua lỗ.'],['Thử túi','Túi rộng ít nhất 55 cm, dài ít nhất 82 cm, lộn miệng ra ngoài vành khoảng 5 cm, lồng vòng chun cách miệng 12 mm.']],
  risk:['Cắt và gấp cả 4 thùng cùng lúc: nếu lệch thì sai cả 4.','Rivet không long đền: đầu rivet tuột qua PP.'],
  tools:['Kìm rút rivet','Máy khò','Thước cặp'],
  out:[['Số đo','Kích thước ngoài','270 ± 3 mm, cao 590 ± 3 mm',0],['Đạt / không','Đặt vào khay','Thùng trước và sau còn khe ngón tay ≥ 15 mm',0]],

 {n:7,t:'Lắp cụm đầu cơ khí',tr:'mech',st:'todo',time:'2–3 ngày',cost:'đã tính ở bước 1, 4',dep:'Bước 2, 4',
  why:'Cụm đầu chứa cơ cấu xoay và nghiêng, phần khó nhất về cơ.',
  do:['Lắp mâm nhôm, 4 thanh treo nhôm hộp 30×30, thanh chữ thập 40×30','Lắp giá chữ C in 3D, trục xoay Ø8 trên 2 gối KFL08, hub in nối càng MG90S với trục','Lắp đế xoay nhôm 4 mm, 2 trụ bản lề, 2 gối KP08, trục nghiêng, tai đĩa, đĩa','Lắp MG996R, puly 20T và 40T, đai 158 mm','Lắp chốt chặn cứng ±70° và 2 cục chặn 47°','Luồn cáp dẹt qua rãnh vòng cuộn, kẹp chống giật'],
  how:[['Trục xoay','Mài mặt phẳng (mặt D) trên đoạn trục 70 mm, siết vít trí M3 của hub vào mặt D, nhỏ keo khoá ren.'],['Căng đai','Đai 158 mm chỉ chỉnh được ±1 mm qua giá servo, nên đo khoảng cách tâm 2 puly đúng 48,58 mm trước khi siết.'],['Kiểm tra bằng tay','Chưa cấp điện: xoay tay đế ±45°, nghiêng tay đĩa ±45° về 4 hướng, không cạ, không rơ.']],

  tools:['Lục giác','Keo khoá ren','Thước đo góc','Dũa hoặc máy mài nhỏ'],
  out:[['Đạt / không','Quay tay xoay ±45°','Êm, không rơ',0],['Đạt / không','Chặn cứng','Chạm ở khoảng ±70°',0],['Số đo','Đĩa nghiêng 45° đủ 4 hướng','Mép thấp hướng đúng 45/135/225/315°',0]],

  how:[['Theo sơ đồ','Sơ đồ khối, bảng chân, dòng điện từng đường và khoá an toàn đều ở trang mạch S3-1.'],['Kiểm tra trước khi cấp điện','Đo thông mạch từng đường, đo không chập giữa 12 V, 6 V, 5 V và GND. Cấp điện lần đầu khi chưa cắm board, đo lại áp.'],['Thử khoá an toàn','Cho servo chạy, kéo ngăn kéo ra: servo phải mất điện ngay.']],

var LANES=[['mech','Cơ khí'],['elec','Điện tử'],['soft','Phần mềm'],['all','Cả nhóm']];
var PHASES=['Chốt','Mua và thử','Gia công','Lắp','Tích hợp','Hoàn thiện'];
var PHASE_OF={0:0,1:1,2:1,3:2,4:2,5:3,6:3,7:3,8:3,9:3,10:3,11:1,12:1,13:4,14:4,15:5,16:5};

function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
var nav=document.getElementById('steps'),panel=document.getElementById('panel');
var cur='road';

function renderSummary(){
  var c={done:0,doing:0,todo:0};STEPS.forEach(function(s){c[s.st]++;});
  var box=document.getElementById('summary');
  [['done','bước xong'],['doing','bước đang làm'],['todo','bước chưa làm']].forEach(function(k){box.append(el('span','pill '+STATUS[k[0]][0],c[k[0]]+' '+k[1]));});
}
function renderNav(){
  nav.innerHTML='';
  var road=el('button');road.setAttribute('role','tab');road.dataset.id='road';
  road.append(el('span','num','◇'),el('span',null,'Lộ trình tổng'),el('span'));nav.append(road);
  STEPS.forEach(function(s){
    var b=el('button');b.setAttribute('role','tab');b.dataset.id=String(s.n);
    b.append(el('span','num',String(s.n).padStart(2,'0')),el('span',null,s.t),el('span','st '+s.st));
    b.title=STATUS[s.st][1];nav.append(b);
  });
  nav.querySelectorAll('button').forEach(function(b){b.onclick=function(){open(b.dataset.id);};});
}
function open(id){
  cur=id;try{localStorage.setItem('aware-plan-step',id);}catch(e){}
  nav.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.id===id);});
  panel.innerHTML='';
  if(id==='road')renderRoad();else renderStep(STEPS[+id]);
  if(window.innerWidth<860)panel.scrollIntoView({block:'start',behavior:'smooth'});
}
function renderRoad(){
  var c=el('section','card');
  c.append(el('h2',null,'Lộ trình tổng'));
  var p=el('p','lead','Ba làn chạy song song. Phần mềm bắt đầu ngay từ lúc đặt hàng, không chờ phần cứng. Bấm một ô để mở bước đó.');p.style.margin='6px 0 14px';c.append(p);
  var wrap=el('div','lanes'),g=el('div','lanegrid');
  g.append(el('div'));PHASES.forEach(function(ph){g.append(el('div','ph',ph));});
  LANES.forEach(function(l){
    var lab=el('div','ln '+TRACK[l[0]][0],l[1]);g.append(lab);
    PHASES.forEach(function(ph,i){
      var cell=el('div');cell.style.display='grid';cell.style.gap='6px';cell.style.alignContent='start';
      STEPS.filter(function(s){return s.tr===l[0]&&PHASE_OF[s.n]===i;}).forEach(function(s){
        var b=el('button','chipstep '+s.st);b.type='button';b.append(el('b',null,String(s.n).padStart(2,'0')),document.createTextNode(s.t));
        b.onclick=function(){open(String(s.n));};cell.append(b);});
      g.append(cell);});
    if(l[0]==='elec'){g.append(el('div'));var gate=el('div','gate','Cổng kiểm tra: bước 2 thử trên bàn phải đạt rồi mới đặt gia công đợt 2 và vỏ');g.append(gate);}
  });
  wrap.append(g);c.append(wrap);panel.append(c);
  var now=el('section','card');now.append(el('h3',null,'Đang ở đâu (cập nhật 20/10)'));
  var ul=el('ul');
  ['Bước 0 xong: thân B, cơ cấu D, thùng gấp PP, mạch S3-1, khung và vỏ Mix 2, các vật tư nhỏ đều đã chốt. Sheet vật tư cộng khoảng 7,4–10,7 triệu (vỏ đổi sang inox 31/10).',
   'Bước 1 đang làm: đợt 1 đã chốt đủ (26 món tab 1, 3 món đầu tab 2 và 3 món cơ khí #38–40 ở tab 1, khoảng 1,6–2,0 triệu). Chưa đặt hàng.',
   'Thay đổi thiết kế từ 17/10 đến 20/10 chưa commit lên nhánh.'].forEach(function(t){ul.append(el('li',null,t));});
  now.append(ul);panel.append(now);
  var nx=el('section','card');nx.append(el('h3',null,'Việc tiếp theo'));
  var tw=el('div');tw.style.overflowX='auto';var tb=el('table');tb.style.width='100%';tb.style.borderCollapse='collapse';tb.style.fontSize='.88rem';tb.style.minWidth='620px';
  var rows=[['#','Việc','Ai','Khi nào','Thuộc bước'],
    ['1','Đặt hàng đợt 1: 26 món tab 1, 3 món đầu tab 2 và 3 món cơ khí #38–40 (khoảng 1,6–2,0 triệu)','Bro','Ngay','1'],
    ['2','Commit và push toàn bộ thay đổi lên nhánh feat/ab-bin-design','Mình','Ngay','—'],
    ['3','CAD đã sửa theo mạch S3-1 (20/10). Còn vẽ lối cắm USB-C, giá kẹp camera, rồi chỉnh theo số đo hàng thật','Mình','Khi hàng về','3'],
    ['4','Thêm lỗ tay nắm âm vào file cắt mặt ngăn kéo','Mình','Trong lúc chờ hàng','3'],
    ['5','Thu ảnh rác: mỗi loại 200–500 ảnh trên nền giống đĩa','Bro, nhóm','Trong lúc chờ hàng','12'],
    ['6','Viết khung firmware: servo, IMU, UART với màn, khoá an toàn','Mình','Trong lúc chờ hàng','11'],
    ['7','Tra giá 17 món đợt 2 còn lại (vật liệu cụm đầu, thùng PP)','Mình','Trong lúc chờ hàng','4'],
    ['8','Nhận hàng: đo từng món theo cột "Việc khi nhận hàng", tích Đã nhận, Đã đo','Bro','Khi hàng về','1'],
    ['9','Thử trên bàn: servo qua đai, camera thấy đĩa, UART, HC-SR04, khoá an toàn','Bro, mình','Khi hàng về','2'],
    ['10','Bước 2 đạt thì đặt đợt 2: khung V lỗ, Formex, vỏ và nắp inox, nhôm cụm đầu, PP thùng','Bro','Sau bước 2','4']];
  rows.forEach(function(r,i){var tr=el('tr');r.forEach(function(c){var td=el(i?'td':'th',null,c);td.style.textAlign='left';td.style.padding='6px 8px';td.style.borderBottom='1px solid var(--line)';td.style.verticalAlign='top';tr.append(td);});tb.append(tr);});
  tw.append(tb);nx.append(tw);panel.append(nx);
}
function renderStep(s){
  var head=el('section','card'),row=el('div','title-row');
  row.append(el('span','num','Bước '+String(s.n).padStart(2,'0')),el('h2',null,s.t),el('span','track '+TRACK[s.tr][0],TRACK[s.tr][1]),el('span','pill '+STATUS[s.st][0],STATUS[s.st][1]));
  head.append(row);
  var why=el('p','lead',s.why);why.style.marginTop='8px';head.append(why);
  var meta=el('div','meta');meta.style.marginTop='14px';
  [['Thời gian',s.time],['Chi phí',s.cost],['Cần xong trước',s.dep]].forEach(function(m){var d=el('div');d.append(el('small',null,m[0]),el('b',null,m[1]));meta.append(d);});
  head.append(meta);panel.append(head);

  var cols=el('div','cols');
  var a=el('section','card');a.append(el('h3',null,'Việc cần làm'));var ol=el('ol');s.do.forEach(function(t){ol.append(el('li',null,t));});a.append(ol);
  var b=el('section','card');b.append(el('h3',null,'Công cụ và tài liệu'));
  if(s.tools.length){var ul=el('ul');s.tools.forEach(function(t){ul.append(el('li',null,t));});b.append(ul);}else b.append(el('p','lead','Không cần công cụ riêng.'));
  if(s.links.length){var lk=el('div','links');lk.style.marginTop='12px';s.links.forEach(function(l){var x=el('a',null,l[0]+' ↗');x.href=l[1];x.target='_blank';x.rel='noopener';lk.append(x);});b.append(lk);}
  cols.append(a,b);panel.append(cols);

  var o=el('section','card');o.append(el('h3',null,'Đầu ra của bước'));
  var p=el('p','lead','Bước chỉ xong khi mọi đầu ra đạt tiêu chí. Thẻ viền xanh là đầu ra đã có.');p.style.marginBottom='12px';o.append(p);
  var grid=el('div','outputs');
  s.out.forEach(function(x){var c=el('div','out'+(x[3]?' ok':''));c.append(el('span','kind',x[0]+(x[3]?' · đã có':'')),el('span','name',x[1]));
    var pass=el('span','pass');pass.append(el('b',null,'Đạt khi: '),document.createTextNode(x[2]));c.append(pass);grid.append(c);});
  o.append(grid);panel.append(o);

  if(s.how&&s.how.length){var h=el('section','card');h.append(el('h3',null,'Cách làm chi tiết'));
    s.how.forEach(function(x){var d=el('div','how');d.append(el('b',null,x[0]),el('p',null,x[1]));h.append(d);});panel.append(h);}
  if(s.risk&&s.risk.length){var r=el('section','card');r.append(el('h3',null,'Lỗi hay gặp'));var ur=el('ul');s.risk.forEach(function(t){ur.append(el('li',null,t));});r.append(ur);panel.append(r);}
}
renderSummary();renderNav();
var start='road';try{start=localStorage.getItem('aware-plan-step')||'road';}catch(e){}
if(start!=='road'&&!STEPS[+start])start='road';
open(start);
</script>
