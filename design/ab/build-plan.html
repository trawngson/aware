var LANES=[['mech','Cơ khí'],['elec','Điện tử'],['soft','Phần mềm'],['all','Cả nhóm']];
var PHASES=['Chốt','Mua và thử','Gia công','Lắp','Tích hợp','Hoàn thiện'];
var PHASE_OF={0:0,1:1,2:1,3:2,4:2,5:3,6:3,7:3,8:3,9:3,10:3,11:1,12:1,13:4,14:4,15:5,16:5};

function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
var nav=document.getElementById('steps'),panel=document.getElementById('panel');
var cur='road';

function renderSummary(){
  var c={done:0,doing:0,todo:0};STEPS.forEach(function(s){c[s.st]++;});
  var box=document.getElementById('summary');
  [['done','bước xong'],['doing','bước đang làm'],['todo','bước chưa làm']].forEach(function(k){box.append(el('span','pill '+STATUS[k[0]][0],c[k[0]]+' '+k[1]));});
}
function renderNav(){
  nav.innerHTML='';
  var road=el('button');road.setAttribute('role','tab');road.dataset.id='road';
  road.append(el('span','num','◇'),el('span',null,'Lộ trình tổng'),el('span'));nav.append(road);
  STEPS.forEach(function(s){
    var b=el('button');b.setAttribute('role','tab');b.dataset.id=String(s.n);
    b.append(el('span','num',String(s.n).padStart(2,'0')),el('span',null,s.t),el('span','st '+s.st));
    b.title=STATUS[s.st][1];nav.append(b);
  });
  nav.querySelectorAll('button').forEach(function(b){b.onclick=function(){open(b.dataset.id);};});
}
function open(id){
  cur=id;try{localStorage.setItem('aware-plan-step',id);}catch(e){}
  nav.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.id===id);});
  panel.innerHTML='';
  if(id==='road')renderRoad();else renderStep(STEPS[+id]);
  if(window.innerWidth<860)panel.scrollIntoView({block:'start',behavior:'smooth'});
}
function renderRoad(){
  var c=el('section','card');
  c.append(el('h2',null,'Lộ trình tổng'));
  var p=el('p','lead','Ba làn chạy song song. Phần mềm bắt đầu ngay từ lúc đặt hàng, không chờ phần cứng. Bấm một ô để mở bước đó.');p.style.margin='6px 0 14px';c.append(p);
  var wrap=el('div','lanes'),g=el('div','lanegrid');
  g.append(el('div'));PHASES.forEach(function(ph){g.append(el('div','ph',ph));});
  LANES.forEach(function(l){
    var lab=el('div','ln '+TRACK[l[0]][0],l[1]);g.append(lab);
    PHASES.forEach(function(ph,i){
      var cell=el('div');cell.style.display='grid';cell.style.gap='6px';cell.style.alignContent='start';
      STEPS.filter(function(s){return s.tr===l[0]&&PHASE_OF[s.n]===i;}).forEach(function(s){
        var b=el('button','chipstep '+s.st);b.type='button';b.append(el('b',null,String(s.n).padStart(2,'0')),document.createTextNode(s.t));
        b.onclick=function(){open(String(s.n));};cell.append(b);});
      g.append(cell);});
    if(l[0]==='elec'){g.append(el('div'));var gate=el('div','gate','Cổng kiểm tra: bước 2 thử trên bàn phải đạt rồi mới đặt gia công đợt 2 và vỏ');g.append(gate);}
  });
  wrap.append(g);c.append(wrap);panel.append(c);
  var now=el('section','card');now.append(el('h3',null,'Đang ở đâu (cập nhật 20/10)'));
  var ul=el('ul');
  ['Bước 0 xong: thân B, cơ cấu D, thùng gấp PP, mạch S3-1, khung và vỏ Mix 2, các vật tư nhỏ đều đã chốt. Sheet vật tư cộng khoảng 5,3–7,8 triệu.',
   'Bước 1 đang làm: đợt 1 đã chốt đủ (26 món tab 1 và 3 món đầu tab 2, khoảng 1,5–1,8 triệu). Chưa đặt hàng.',
   'Thay đổi thiết kế từ 17/10 đến 20/10 chưa commit lên nhánh.'].forEach(function(t){ul.append(el('li',null,t));});
  now.append(ul);panel.append(now);
  var nx=el('section','card');nx.append(el('h3',null,'Việc tiếp theo'));
  var tw=el('div');tw.style.overflowX='auto';var tb=el('table');tb.style.width='100%';tb.style.borderCollapse='collapse';tb.style.fontSize='.88rem';tb.style.minWidth='620px';
  var rows=[['#','Việc','Ai','Khi nào','Thuộc bước'],
    ['1','Đặt hàng đợt 1: 26 món tab 1 và 3 món đầu tab 2 (khoảng 1,5–1,8 triệu)','Bro','Ngay','1'],
    ['2','Commit và push toàn bộ thay đổi lên nhánh feat/ab-bin-design','Mình','Ngay','—'],
    ['3','Sửa CAD theo mạch S3-1: bệ màn cho Guition 4,3", chỗ đặt board CAM, cửa sổ camera cho cáp 75 mm; đổi màn TJC trong bảng giá','Mình','Trong lúc chờ hàng','3'],
    ['4','Thêm lỗ tay nắm âm vào file cắt mặt ngăn kéo','Mình','Trong lúc chờ hàng','3'],
    ['5','Thu ảnh rác: mỗi loại 200–500 ảnh trên nền giống đĩa','Bro, nhóm','Trong lúc chờ hàng','12'],
    ['6','Viết khung firmware: servo, IMU, UART với màn, khoá an toàn','Mình','Trong lúc chờ hàng','11'],
    ['7','Tra giá 17 món đợt 2 còn lại (vật liệu cụm đầu, thùng PP)','Mình','Trong lúc chờ hàng','4'],
    ['8','Nhận hàng: đo từng món theo cột "Việc khi nhận hàng", tích Đã nhận, Đã đo','Bro','Khi hàng về','1'],
    ['9','Thử trên bàn: servo qua đai, camera thấy đĩa, UART, HC-SR04, khoá an toàn','Bro, mình','Khi hàng về','2'],
    ['10','Bước 2 đạt thì đặt đợt 2: khung V lỗ, Formex, nắp inox, nhôm cụm đầu, PP thùng','Bro','Sau bước 2','4']];
  rows.forEach(function(r,i){var tr=el('tr');r.forEach(function(c){var td=el(i?'td':'th',null,c);td.style.textAlign='left';td.style.padding='6px 8px';td.style.borderBottom='1px solid var(--line)';td.style.verticalAlign='top';tr.append(td);});tb.append(tr);});
  tw.append(tb);nx.append(tw);panel.append(nx);
}
function renderStep(s){
  var head=el('section','card'),row=el('div','title-row');
  row.append(el('span','num','Bước '+String(s.n).padStart(2,'0')),el('h2',null,s.t),el('span','track '+TRACK[s.tr][0],TRACK[s.tr][1]),el('span','pill '+STATUS[s.st][0],STATUS[s.st][1]));
  head.append(row);
  var why=el('p','lead',s.why);why.style.marginTop='8px';head.append(why);
  var meta=el('div','meta');meta.style.marginTop='14px';
  [['Thời gian',s.time],['Chi phí',s.cost],['Cần xong trước',s.dep]].forEach(function(m){var d=el('div');d.append(el('small',null,m[0]),el('b',null,m[1]));meta.append(d);});
  head.append(meta);panel.append(head);

  var cols=el('div','cols');
  var a=el('section','card');a.append(el('h3',null,'Việc cần làm'));var ol=el('ol');s.do.forEach(function(t){ol.append(el('li',null,t));});a.append(ol);
  var b=el('section','card');b.append(el('h3',null,'Công cụ và tài liệu'));
  if(s.tools.length){var ul=el('ul');s.tools.forEach(function(t){ul.append(el('li',null,t));});b.append(ul);}else b.append(el('p','lead','Không cần công cụ riêng.'));
  if(s.links.length){var lk=el('div','links');lk.style.marginTop='12px';s.links.forEach(function(l){var x=el('a',null,l[0]+' ↗');x.href=l[1];x.target='_blank';x.rel='noopener';lk.append(x);});b.append(lk);}
  cols.append(a,b);panel.append(cols);

  var o=el('section','card');o.append(el('h3',null,'Đầu ra của bước'));
  var p=el('p','lead','Bước chỉ xong khi mọi đầu ra đạt tiêu chí. Thẻ viền xanh là đầu ra đã có.');p.style.marginBottom='12px';o.append(p);
  var grid=el('div','outputs');
  s.out.forEach(function(x){var c=el('div','out'+(x[3]?' ok':''));c.append(el('span','kind',x[0]+(x[3]?' · đã có':'')),el('span','name',x[1]));
    var pass=el('span','pass');pass.append(el('b',null,'Đạt khi: '),document.createTextNode(x[2]));c.append(pass);grid.append(c);});
  o.append(grid);panel.append(o);
}
renderSummary();renderNav();
var start='road';try{start=localStorage.getItem('aware-plan-step')||'road';}catch(e){}
if(start!=='road'&&!STEPS[+start])start='road';
open(start);
</script>
