; AWARE bin MVP firmware: ESP32-S3 N16R8 CAM board (OV2640) and one servo.
; Arduino core 3 is built as a component of ESP-IDF, so sdkconfig.defaults
; can raise the network buffers (see the note there). The first build takes
; several minutes.
; Build and flash: pio run -d firmware -t upload. Routing tests on the Mac:
; pio test -d firmware -e native

[platformio]
default_envs = esp32s3cam

[env:esp32s3cam]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino, espidf
; N16R8: 16 MB quad flash, 8 MB octal PSRAM (set in sdkconfig.defaults)
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
lib_deps =
  bblanchon/ArduinoJson@7.4.3
; Same as Serial.begin in main.cpp. The chip's own boot messages stay at
; 115200, so a few garbled characters at reset are normal.
monitor_speed = 921600
; Turns crash addresses into file and line numbers in the monitor
monitor_filters = esp32_exception_decoder

; Wokwi simulator build: same board settings, photos from sim/photos in place
; of the camera, and one merged flash image (see wokwi.toml and diagram.json)
[env:sim]
extends = env:esp32s3cam
build_flags =
  -DAWARE_SIMULATOR
extra_scripts =
  pre:scripts/sim_photos.py
  post:scripts/merge_flash_image.py

; routing-v1 unit tests on the Mac
[env:native]
platform = native
test_build_src = no
extra_scripts = pre:scripts/native_tests_only.py
