summary: >-
  On the iPhone XR, YOLO26n meets the size, speed, memory, latency-drift, and
  battery limits with wide margins (p95 30.5 ms against 100 ms; 78 MiB
  against 500 MiB; at least 21.6 FPS in every minute). Continuous scanning
  reaches iOS thermal state "serious" after about 3 minutes 45 seconds, so
  the run FAILS protocol v1, whose thermal gate fails at serious. The user
  then revised the thermal gate to fail only at critical (protocol v2),
  because the app is used for short scans and throttling is already gated by
  FPS and latency drift, which held (worst minute 21.6 FPS, drift 9%). Under
  v2 the run PASSES. The phone stayed nominal for the first 95 seconds, and
  the first frame arrived 2.6 s after the camera opened. The app ships
  YOLO26n by the user's decision (records/app-model-release-v1.yaml).
